<!DOCTYPE HTML>
<html>

<head>
    <title>Message transmis — El Islah Mhoma</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <!-- Page de confirmation : sans intérêt dans les résultats de recherche -->
    <meta name="robots" content="noindex, follow" />
    <link rel="stylesheet" href="assets/css/main.css?v=14" />
    <noscript>
        <link rel="stylesheet" href="assets/css/noscript.css?v=14" />

    <style>
        body { background-color: #0b0e14; }
        .success-container {
            text-align: center;
            padding: 4em 2em;
            max-width: 600px;
            margin: 10vh auto;
            border: 1px solid rgba(0, 255, 65, 0.2);
            background: rgba(0, 255, 65, 0.02);
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(0, 255, 65, 0.05);
        }
        .status-icon {
            font-size: 4em;
            color: #00ff41;
            margin-bottom: 0.5em;
            text-shadow: 0 0 15px rgba(0, 255, 65, 0.5);
        }
        h2 { color: #00ff41 !important; letter-spacing: 2px; }
        .typing-text {
            font-family: 'Courier New', Courier, monospace;
            border-right: 2px solid #00ff41;
            white-space: nowrap;
            overflow: hidden;
            display: inline-block;
            animation: typing 2.5s steps(40, end), blink-caret .75s step-end infinite;
        }
        @keyframes typing { from { width: 0 } to { width: 100% } }
        @keyframes blink-caret { from, to { border-color: transparent } 50% { border-color: #00ff41; } }
    </style>
</head>

<body class="is-preload">
    <div id="wrapper">
        <div class="success-container">

        </footer>
    </div>

    <script src="assets/js/jquery.scrollex.min.js"></script>
    <script src="assets/js/main.js"></script>
</body>

</html>
